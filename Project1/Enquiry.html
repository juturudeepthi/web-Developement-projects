<html>
    <head>
        <style>
            *{
                font-size: xx-large;
                text-align: center;
                padding-top:10px;
               
                
            }
            .formbox{
                border-left: 10px rgba(7, 7, 7, 0.842);
                box-sizing: border-box;
                background-color: rgb(212, 213, 234);
                border-radius:30px;
                box-shadow: 0px 0px 0px gray;
                text-align: center;
                margin: 100px;
                padding-top:10px;
                padding-bottom: 30px;
            }
            select,input{
                width:30%;
                border-radius: 10px;
                padding:20px;
            }
            button{
                background-color: aqua;
                border-radius: 10px;
                width:30%;
            }

        </style>
        <script src="https://kit.fontawesome.com/37fa3e383b.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <main>
            <div class="formbox">
                <h5>Request for</h5>
                <p>Class Room & Online Training Quotation</p>
                <label><i class="fa-solid fa-house" ></i>Class Room</label>
                <label style="margin-left: 20px;"><i class="fa-solid fa-laptop"></i>Online</label><br><br>
                <input type="text" placeholder="Enter Your Name" required><br><br>
                <input type="email" placeholder="Enter Your Email"><br><br>
                <input type="number" placeholder="Enter Your Number" required><br><br>
                <select>
                    <option>Select Course         </option>
                    <option>Full Stack</option>
                    <option>Data Analytics</option>
                    <option>Data Science</option>
                    <option>AWS</option>
                    <option>Devops</option>
                    <option>Testing</option>
                </select><br><br>
                <button>Submit</button>


                
        </div>
        </main>
    </body>
</html>
