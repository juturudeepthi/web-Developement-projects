
<!DOCTYPE html>
<html>
<head>
    <h1>Increment and Decrement Using the Event Functions in Java Script</h1>
</head>

<body>

    <h1 id="count"></h1>

    <button onclick="increment()" >Increment</button>
    <button onclick="decrement()">Decrement</button>
    <button onclick="reset()">Reset</button>

    <script>

      
        let value = 0;

       
        function increment() {
            value = value + 1;
            document.getElementById("count").innerHTML = value;
        }

        
        function decrement() {
            value = value - 1;
            document.getElementById("count").innerHTML = value;
        }

        
        function reset() {
            value = 0;
            document.getElementById("count").innerHTML = value;
        }

    </script>

</body>
</html>
